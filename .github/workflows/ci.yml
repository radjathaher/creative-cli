name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal main.go)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
